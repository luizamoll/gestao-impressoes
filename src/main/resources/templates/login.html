
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Portal UNH</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(145deg, #edf7f1, #f8fafb 60%, #e6f0ec);
            color: #173c32;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 34px;
            background: white;
            border: 1px solid #dbe9e2;
            border-radius: 24px;
            box-shadow: 0 22px 65px rgba(21, 70, 50, .12);
            text-align: center;
        }

        .brand {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #408366;
        }

        .avatar {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 30px auto 20px;
            border: 5px solid #e3f3e9;
            border-radius: 30px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #d5f0df, #f3faf6);
        }

        .avatar svg {
            width: 64px;
            height: 64px;
            stroke: #287950;
            fill: none;
            stroke-width: 1.5;
        }

        .status {
            position: absolute;
            right: -5px;
            bottom: -5px;
            width: 25px;
            height: 25px;
            border: 4px solid white;
            border-radius: 50%;
            background: #35bd78;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 27px;
            letter-spacing: -.8px;
        }

        .subtitle {
            margin-bottom: 28px;
            font-size: 14px;
            line-height: 1.6;
            color: #687d74;
        }

        form { text-align: left; }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 13px;
            font-weight: 600;
        }

        input:not([type="hidden"]) {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5e3dc;
            border-radius: 11px;
            font: inherit;
            outline-color: #32845e;
        }

        .submit {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 11px;
            background: #227b50;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit:hover { background: #175c3c; }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #47745e;
            text-decoration: none;
            font-size: 13px;
        }

        .feedback {
            padding: 12px;
            border-radius: 9px;
            background: #fff1f0;
            color: #a12525;
            font-size: 13px;
        }

        .footer {
            margin-top: 25px;
            color: #91a49a;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand">PORTAL UNH</div>

        <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 64 64">
                <circle cx="32" cy="23" r="11"/>
                <path d="M12 55c0-13 9-20 20-20s20 7 20 20"/>
            </svg>
            <span class="status"></span>
        </div>

        <h1>Bem-vindo de volta!</h1>

        <p class="subtitle">
            Seu espaço de trabalho está esperando por você.
            Entre para acessar suas ferramentas.
        </p>

        <p class="feedback" th:if="${param.error}">
            Usuário ou senha incorretos.
        </p>

        <form th:action="@{/login}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label for="username">Usuário</label>
            <input id="username" name="username"
                   type="text" autocomplete="username"
                   required>

            <label for="password">Senha</label>
            <input id="password" name="password"
                   type="password"
                   autocomplete="current-password"
                   required>

            <button class="submit" type="submit">
                Entrar no meu espaço →
            </button>
        </form>

        <a class="back" th:href="@{/}">
            ← Continuar sem fazer login
        </a>

        <div class="footer">
            Unihorizontes · Ambiente de desenvolvimento
        </div>
    </main>
</body>
</html>
