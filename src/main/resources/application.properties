spring.application.name=gestao-impressoes
server.port=${PORT:8080}
server.address=0.0.0.0

# O portal exibe telas estaticas ate a API de persistencia estar implementada.
# O banco somente e ativado quando a TI definir SPRING_PROFILES_ACTIVE=banco.
spring.profiles.default=sem-banco


# Ponte Java-Python desativada ate a autenticacao institucional ser integrada.
perseus.integration.enabled=false
# Para testes locais protegidos, ativar via PERSEUS_INTEGRATION_ENABLED=true
