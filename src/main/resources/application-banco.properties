# Banco real: habilitar explicitamente com SPRING_PROFILES_ACTIVE=banco.
# DB_URL deve ser uma URL JDBC: jdbc:postgresql://HOST:5432/BANCO
# Segredos sao fornecidos pela infraestrutura da UNH, nunca pelo GitHub.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Nao alterar tabelas automaticamente. Migracoes devem ser planejadas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
