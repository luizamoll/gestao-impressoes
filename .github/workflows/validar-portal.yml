name: Validar Portal UNH

on:
  push:
    branches:
      - feat/estrutura-mvp-esg
      - feat/autenticacao-portal
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verificar sintaxe JavaScript dos modulos ativos
        run: |
          node --version
          node --check src/main/resources/static/js/gestao-vista.js
          node --check src/main/resources/static/js/portal.js
          node --check src/main/resources/static/js/mural.js
          node --check src/main/resources/static/js/nexo-assistente.js
          node --check src/main/resources/static/js/nexo-agente.js
          node --test tests/gestao-vista-ui.test.cjs
          node --test tests/gestao-vista-funcional.test.cjs
          node --test tests/gestao-dashboard-ref.test.cjs
          node --test tests/nexo-assistente.test.cjs
          node --test tests/nexo-agente.test.cjs
          node --test tests/portal-home-v3.test.cjs
          node --test tests/portal-palette.test.cjs
          node --test tests/portal-editorial.test.cjs
      - name: Testes do Portal e conector Perseus
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp test
